version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: g-d-app-store-gd-magazzino_magazzino_1
      APP_PORT: 8000
      # Login Umbrel obbligatorio: dalla v2 l'app non ha una password propria.
      PROXY_AUTH_ADD: "true"

  magazzino:
    image: ghcr.io/gigiomiccio425/magazzino-zimaos:2.0.0

    restart: on-failure

    environment:
      APP_NAME: MAGAZZINO
      TZ: Europe/Rome
      DATA_DIR: /data

    volumes:
      - ${APP_DATA_DIR}/data:/data
