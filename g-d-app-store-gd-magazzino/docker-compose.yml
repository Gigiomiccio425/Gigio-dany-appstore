version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: g-d-app-store-gd-magazzino_magazzino_1
      APP_PORT: 8000
      PROXY_AUTH_ADD: "false"

  magazzino:
    image: ghcr.io/gigiomiccio425/magazzino-zimaos:1.1.1

    restart: on-failure

    environment:
      APP_PASSWORD: ${APP_PASSWORD:-cambiami}
      APP_NAME: ${APP_NAME:-MAGAZZINO}
      SECRET_KEY: ${SECRET_KEY:-}
      TZ: ${TZ:-Europe/Rome}
      DATA_DIR: /data

    volumes:
      - ${APP_DATA_DIR}/data:/data