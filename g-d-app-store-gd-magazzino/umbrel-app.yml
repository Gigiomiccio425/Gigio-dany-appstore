manifestVersion: 1
id: g-d-app-store-gd-magazzino
name: GD Magazzino
tagline: Magazzino hardware e centro di comando del server
icon: https://gigiomiccio.it/magazzino/icon.png
category: Utilities
version: "2.0.0"
port: 8000

description: >-
  GD Magazzino cataloga componenti e hardware (schede video, cavi, RAM, dischi)
  con posizioni e QR su ogni prodotto, registro dei test e inventari fisici.
  Fa anche da centro di comando del server: servizi, changelog con link GitHub,
  incidenti, manutenzioni e avvisi su Discord. Ogni modifica è firmata
  dall'operatore con impronta o password.

developer: Gigiomiccio425
website: https://gigiomiccio.it
submitter: Gigiomiccio425
submission: https://github.com/Gigiomiccio425/Gigio-dany-appstore
repo: https://github.com/Gigiomiccio425/magazzino-zimaOS
support: https://github.com/Gigiomiccio425/magazzino-zimaOS/issues

gallery:
  - https://i.imgur.com/yyVG0Jb.jpeg

releaseNotes: >-
  Versione 2.0: gestionale completo. Il database della 1.1 viene migrato in
  automatico, con un backup salvato prima. La password dell'app è stata tolta:
  l'accesso è protetto dal login Umbrel. Alla prima modifica ogni operatore
  registra il proprio nome e la propria impronta o password. Novità: QR ed
  etichette, campi per categoria, foto, registro test, inventari, progetti,
  servizi, changelog, incidenti, manutenzioni, avvisi Discord, tema scuro,
  app installabile su telefono.

dependencies: []

path: ""
defaultUsername: ""
defaultPassword: ""