name: GD Insta Scheduler
version: "1.0.1"
tagline: Programma e pubblica post su Instagram
icon: https://raw.githubusercontent.com/danyx67800/insta-scheduler/main/exports/icon.png
description: >
  Programma e pubblica automaticamente post su Instagram dal tuo Umbrel,
  senza passare da servizi cloud.


  Cosa fa:


  - Colleghi l'account Instagram Business/Creator via Instagram Graph API
    (Access Token + IG User ID, con test di connessione integrato)

  - Carichi immagini (JPG/PNG/WebP) o video (MP4), anche in carosello fino
    a 10 media, scrivi la caption e scegli data e ora di pubblicazione

  - Un cron interno controlla ogni minuto i post in coda e li pubblica da
    solo; stati `bozza`, `programmato`, `pubblicato`, `errore`, con log
    consultabili e pulsanti «Pubblica ora» / «Riprova»

  - Calendario mensile dei post programmati, lista delle bozze, cronologia
    degli invii con link al permalink Instagram


  Nota importante: Meta scarica i media da un URL pubblico, quindi serve
  `PUBLIC_URL` raggiungibile (dominio, Tailscale o `http://umbrel.local:8757`
  in rete locale). Database SQLite e upload stanno in `/data`, persistenti
  agli aggiornamenti.

