releaseNotes: >-
  Prima versione di ANGEL per umbrelOS. Stessa immagine usata su ZimaOS
  (ghcr.io/gigiomiccio425/aegis-discord-bot:1.24.0): bot, worker e pannello in
  un contenitore solo, con Postgres e Redis accanto.

