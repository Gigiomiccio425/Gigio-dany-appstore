# ─────────────────────────────────────────────────────────────
#  ANGEL su umbrelOS
#
#  Stessa immagine della VPS: dentro un solo contenitore girano migrazione
#  del database, bot, worker e pannello, tenuti in vita da un supervisore.
#
#  I segreti NON stanno qui: questa repository è pubblica. Vanno scritti in
#     ~/umbrel/app-data/g-d-app-store-angel/.env
#  che Docker Compose legge da solo perché è la cartella del progetto.
#  Il modello da copiare è `env.esempio` accanto a questo file.
# ─────────────────────────────────────────────────────────────
version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: g-d-app-store-angel_angel_1
      APP_PORT: 8080
      # Il pannello ha già il suo accesso con Discord OAuth2: la richiesta di
      # password di Umbrel davanti aggiungerebbe solo un secondo cancello,
      # e romperebbe il ritorno dal login di Discord.
      PROXY_AUTH_ADD: "false"

  angel:
    image: ghcr.io/gigiomiccio425/aegis-discord-bot:1.27.0
    restart: on-failure
    stop_grace_period: 1m
    logging:
      driver: json-file
      options:
        # Senza limite un errore che si ripete riempie il disco con il proprio
        # racconto: gigabyte di righe identiche mentre lo spazio finisce.
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}

      DATABASE_URL: postgresql://angel:${ANGEL_DB_PASSWORD:-angel_umbrel_local}@g-d-app-store-angel_postgres_1:5432/angel?schema=public
      REDIS_URL: redis://g-d-app-store-angel_redis_1:6379
      STORAGE_DIR: /data/storage

      # ── Da compilare in app-data/g-d-app-store-angel/.env ──
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      OWNER_IDS: ${OWNER_IDS:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Cifra i token salvati nel database. Con una chiave diversa da quella
      # del server principale i dati esportati da un altro nodo non sarebbero
      # rileggibili: se questa installazione affianca una esistente, va copiata
      # identica, non rigenerata.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}

      # Deve combaciare **esattamente** con l'indirizzo che digiti nel browser,
      # porta compresa, ed essere lo stesso registrato come redirect OAuth2
      # (con /api/auth/callback in fondo). Altrimenti l'accesso al pannello
      # fallisce con «stato non valido».
      PUBLIC_URL: ${PUBLIC_URL:-http://umbrel.local:7801}

      API_PORT: "8080"
      DEV_GUILD_ID: ${DEV_GUILD_ID:-}
      # Riserva il pannello agli ID in OWNER_IDS. Con 'false' entra chiunque
      # abbia MANAGE_GUILD su un server dove il bot è presente.
      PANEL_OWNERS_ONLY: ${PANEL_OWNERS_ONLY:-true}

      GOOGLE_SAFE_BROWSING_KEY: ${GOOGLE_SAFE_BROWSING_KEY:-}
      THREAT_FEEDS_ENABLED: ${THREAT_FEEDS_ENABLED:-true}

      # ── Bot Twitch: senza queste resta spento ──
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      TWITCH_EVENTSUB_SECRET: ${TWITCH_EVENTSUB_SECRET:-}
      TWITCH_SETUP_KEY: ${TWITCH_SETUP_KEY:-}
      TWITCH_BOT_USER_ID: ${TWITCH_BOT_USER_ID:-}
      TWITCH_BOT_LOGIN: ${TWITCH_BOT_LOGIN:-}
      TWITCH_BOT_ACCESS_TOKEN: ${TWITCH_BOT_ACCESS_TOKEN:-}
      TWITCH_BOT_REFRESH_TOKEN: ${TWITCH_BOT_REFRESH_TOKEN:-}
      TWITCH_PUBLIC_URL: ${TWITCH_PUBLIC_URL:-}
      TWITCH_PANEL_PORT: "781"

      BACKUP_DIR: /backup
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_INCLUDE_STORAGE: "true"
      BACKUP_STORAGE_MAX_MB: "4096"

      TZ: ${TZ:-Europe/Rome}
    volumes:
      - ${APP_DATA_DIR}/data/storage:/data/storage
      # Le copie stanno in una cartella a parte e non dentro `data`: così una
      # cancellazione dei dati dell'app non porta via anche ciò che li protegge.
      - ${APP_DATA_DIR}/backup:/backup
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:17
    restart: on-failure
    environment:
      POSTGRES_USER: angel
      POSTGRES_PASSWORD: ${ANGEL_DB_PASSWORD:-angel_umbrel_local}
      POSTGRES_DB: angel
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    # Nessun healthcheck di proposito: l'attesa del database sta già nel
    # supervisore dentro ANGEL, che riprova finché Postgres non risponde.

  redis:
    image: redis:7-alpine
    restart: on-failure
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - ${APP_DATA_DIR}/data/redis:/data
