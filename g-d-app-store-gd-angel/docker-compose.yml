    environment:
      APP_HOST: gigiodany-angel_angel_1
      APP_PORT: 8080
    container_name: g-d-app-store-gd-angel_app_proxy_1
  angel:
    image: ghcr.io/gigiomiccio425/aegis-discord-bot:1.27.2
    restart: on-failure
    stop_grace_period: 1m
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      TZ: Europe/Rome
      DATABASE_URL: DATABASE_URL: 'postgresql://angel:LA_TUA_PASSWORD@postgres:5432/angel?schema=public'
      REDIS_URL: redis://redis:6379
      DISCORD_TOKEN: MTUzNjQyODQ2MTY2MzQ1MzI4NA.GAxb8e.uEnJjkwMqvxosPkgXZTQUAc9yvVb9RCdDEWDmY
      DISCORD_CLIENT_ID: '1536428461663453284'
      DISCORD_CLIENT_SECRET: vX0eCox7dfnShRBIsQMUGRN07WKM119A
      OWNER_IDS: '586922655349866536'
      DEV_GUILD_ID: ''
      PANEL_OWNERS_ONLY: 'true'
      PUBLIC_URL: http://umbrel-1.taila0adf7.ts.net:780
      API_PORT: '8080'
      SESSION_SECRET: 4a3de971bb455c20215393b9ede75808361c9af484208ba4ba3f9429acf06004
      ENCRYPTION_KEY: 7823acc691dc9ed3e517bf940f16291debeaff8d725513a65123bc11d7cca5d0
      GOOGLE_SAFE_BROWSING_KEY: ''
      ABUSECH_AUTH_KEY: ''
      THREAT_FEEDS_ENABLED: 'true'
      THREAT_FEED_MAX: '150000'
      TWITCH_CLIENT_ID: 0zw24e3xxmqm508ozeztu3le6aiets
      TWITCH_CLIENT_SECRET: ixmzfcxujcofg7zi4cks99eu3y00ji
      TWITCH_EVENTSUB_SECRET: ''
      TWITCH_SETUP_KEY: ''
      TWITCH_BOT_USER_ID: ''
      TWITCH_BOT_LOGIN: ''
      TWITCH_BOT_ACCESS_TOKEN: ''
      TWITCH_BOT_REFRESH_TOKEN: ''
      TWITCH_PUBLIC_URL: http://umbrel.local:781
      TWITCH_PANEL_PORT: '781'
      STORAGE_DIR: /data/storage
      BACKUP_DIR: /backup
      BACKUP_KEEP: '14'
      BACKUP_INCLUDE_STORAGE: 'true'
      BACKUP_STORAGE_MAX_MB: '4096'
    volumes:
      - ${APP_DATA_DIR}/home:/data/storage
      - ${APP_DATA_DIR}/data/backup:/backup
    ports:
      - '781:781'
    depends_on:
      - postgres
      - redis
    container_name: g-d-app-store-gd-angel_angel_1
  postgres:
    image: postgres:17
    restart: on-failure
    stop_grace_period: 1m
    environment:
      POSTGRES_USER: angel
      POSTGRES_DB: angel
      POSTGRES_PASSWORD: LA_TUA_PASSWORD
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    container_name: g-d-app-store-gd-angel_postgres_1
  redis:
    image: redis:7-alpine
    restart: on-failure
    command:
      - redis-server
      - '--save'
      - 300 100
      - '--appendonly'
      - 'no'
      - '--stop-writes-on-bgsave-error'
      - 'no'
      - '--maxmemory-policy'
      - noeviction
    volumes:
      - ${APP_DATA_DIR}/data/redis:/data
    container_name: g-d-app-store-gd-angel_redis_1
