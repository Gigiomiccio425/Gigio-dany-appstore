# ─────────────────────────────────────────────────────────────
#  Beszel — app per umbrelOS
#
#  Qui c'è solo il *hub*, cioè il pannello. L'agente che raccoglie le misure
#  è un'app a parte, «Beszel Agent» in questo stesso store: si installa
#  dopo, perché vuole un token che il pannello genera al primo accesso.
#
#  Sono due app e non due container della stessa perché fanno due mestieri
#  diversi e si spengono in momenti diversi: il pannello può stare fermo
#  senza che le macchine smettano di essere sorvegliate, e un agente si
#  installa su una macchina dove il pannello non c'è affatto.
#
#  Differenze dal compose ufficiale di Beszel, e non sono cosmetiche:
#
#  • C'è `app_proxy`. È il servizio con cui umbrelOS pubblica un'app: la
#    porta 8090 la apre lui e la gira al container. Senza, l'app si
#    installa e non compare da nessuna parte. Per lo stesso motivo sparisce
#    la sezione `ports:` dell'originale: pubblicare la porta due volte la
#    fa contendere fra proxy e container.
#
#  • I percorsi passano da `${APP_DATA_DIR}`, che umbrelOS sostituisce con
#    la cartella dei dati dell'app. I percorsi relativi dell'originale
#    (`./beszel_data`) finirebbero dove capita a seconda di dove compose
#    viene lanciato.
#
#  • Niente `container_name`. Su umbrelOS il nome lo compone il progetto
#    (<id-app>_<servizio>_1), ed è quello che `APP_HOST` deve indicare:
#    fissarlo a mano fa divergere le due cose.
#
#  • Niente `beszel_socket`. È la scorciatoia per un agente che gira nello
#    stesso compose: qui l'agente è un'app separata, con una cartella dei
#    dati sua, e il socket non sarebbe raggiungibile da lì. I due si
#    parlano via rete.
# ─────────────────────────────────────────────────────────────
version: "3.7"

services:
  # umbrelOS pubblica l'app attraverso questo. `APP_HOST` è il nome del
  # container come lo genera compose: <id-app>_<servizio>_1. Sbagliarlo
  # produce un'app che si installa, parte, e mostra una pagina bianca.
  app_proxy:
    environment:
      APP_HOST: g-d-app-store-gd-beszel_beszel_1
      APP_PORT: 8090
      # Beszel ha già il suo accesso con utente e password, creati al primo
      # avvio. La richiesta di password di umbrelOS davanti aggiungerebbe
      # solo un secondo cancello sullo stesso portone.
      PROXY_AUTH_ADD: "false"

  beszel:
    # Versione fissata, non `latest`: umbrelOS capisce che c'è un
    # aggiornamento confrontando la `version` del manifesto, e con un tag
    # mobile l'immagine cambierebbe a ogni riavvio senza che il pannello lo
    # dica mai — compresi i cambi che rompono, in un momento qualsiasi.
    # Per aggiornare: cambia il numero qui e la `version` in umbrel-app.yml.
    image: henrygd/beszel:0.19.0
    restart: on-failure
    stop_grace_period: 1m
    logging:
      driver: json-file
      options:
        # Senza limite un errore che si ripete riempie il disco con il
        # proprio racconto.
        max-size: "10m"
        max-file: "3"
    environment:
      # Finisce nei link dentro le email e i webhook di allarme. Se non
      # combacia con l'indirizzo da cui apri davvero il pannello, gli
      # allarmi arrivano con dentro un link che non porta da nessuna parte.
      APP_URL: http://umbrel.local:8090
      TZ: Europe/Rome
    volumes:
      # Database, utenti, sistemi registrati e storico delle misure.
      - ${APP_DATA_DIR}/data/beszel:/beszel_data
